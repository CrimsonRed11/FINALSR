<style>
:root{--navy:#061329;--blue:#0b2a55;--blue2:#164d88;--silver:#d9e0e8;--white:#f7f9fc;--muted:#9fb0c7;--line:rgba(217,224,232,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit;color:inherit}
#app{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 20%,#0d115c 0,#07152d 42%,#030b18 100%)}
.screen{position:absolute;inset:0;display:none;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);overflow:hidden}.screen.active{display:flex;flex-direction:column}
#splash{align-items:center;justify-content:center;text-align:center}.mark{font-weight:800;letter-spacing:.22em;font-size:clamp(20px,4vw,34px);margin-bottom:18px}.silver-line{height:1px;width:min(320px,65vw);background:linear-gradient(90deg,transparent,var(--silver),transparent);margin:0 auto 24px}.splash-title{font-size:clamp(34px,7vw,70px);font-weight:750;letter-spacing:-.04em}.splash-sub{color:var(--muted);font-size:clamp(15px,2.4vw,22px);margin-top:12px}.tap{margin-top:46px;border:1px solid var(--line);background:rgba(255,255,255,.06);padding:15px 25px;border-radius:999px;color:var(--white);animation:pulse 2s infinite}@keyframes pulse{50%{transform:translateY(-2px);opacity:.7}}
header{height:78px;display:flex;align-items:center;justify-content:space-between;flex:none}.brand{font-weight:800;letter-spacing:.16em;font-size:14px}.back{border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:9px 15px}.title{font-size:clamp(30px,5vw,48px);font-weight:750;letter-spacing:-.035em;margin:10px 0}.sub{color:var(--muted);font-size:16px;max-width:720px}
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:35px;max-width:900px}.card{border:1px solid var(--line);border-radius:24px;padding:28px;min-height:170px;background:linear-gradient(145deg,rgba(18,65,115,.52),rgba(255,255,255,.035));text-align:left}.card:active{transform:scale(.985)}.card h2{margin:0 0 8px;font-size:25px}.card p{margin:0;color:var(--muted);line-height:1.5}.pill{display:inline-block;margin-top:20px;border:1px solid var(--line);border-radius:999px;padding:7px 11px;font-size:12px;color:var(--silver)}
.viewer-wrap{position:relative;flex:1;min-height:0;margin-top:14px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 40%,#173a67,#040b16 70%)}model-viewer{width:100%;height:100%;background:transparent;--poster-color:transparent}.ar-button{position:absolute;right:18px;bottom:18px;background:var(--white);color:#07152d;border:0;border-radius:999px;padding:14px 20px;font-weight:750;box-shadow:0 10px 30px rgba(0,0,0,.3)}.hint{position:absolute;left:18px;bottom:18px;color:var(--muted);font-size:12px;background:rgba(0,0,0,.28);padding:9px 12px;border-radius:999px}
.air-card{position:relative;flex:1;min-height:0;margin-top:14px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#12325a,#030a14 72%)}#air3d{width:100%;height:100%;display:block}.air-ui{position:absolute;left:18px;right:18px;bottom:18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.control{background:rgba(4,12,25,.84);border:1px solid var(--line);border-radius:999px;padding:10px 14px}.control input{width:150px;vertical-align:middle}.toggle{border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:10px 14px}.toggle.on{background:rgba(35,109,190,.45)}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-top:28px}.info{border:1px solid var(--line);border-radius:20px;padding:20px;background:rgba(255,255,255,.035)}.info b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}.info span{font-size:21px}.footer{color:#70839d;font-size:11px;margin:12px 0 10px}.note{margin-top:12px;color:#91a4bc;font-size:12px;line-height:1.45}
@media(max-width:700px){.screen{padding-left:16px;padding-right:16px}.menu-grid{grid-template-columns:1fr}.card{min-height:125px;padding:21px}.info-grid{grid-template-columns:1fr 1fr}.title{margin-top:3px}.hint{display:none}}
</style></head><body><div id="app">
<section id="splash" class="screen active"><div class="mark">SILVER RACING WALES</div><div class="silver-line"></div><div class="splash-title">Introducing Arian</div><div class="splash-sub">Our 2026 World Finals Car</div><button class="tap" onclick="show('menu')">Tap to interact</button></section>
<section id="menu" class="screen"><header><div class="brand">SILVER RACING WALES</div></header><div class="title">Explore Arian</div><div class="sub">   </div><div class="menu-grid">
<button class="card" onclick="show('car')"><h2>01 · Car</h2><p>Rotate, zoom and inspect our car in 3D.</p><span class="pill">Tap Here</span></button>
<button class="card" onclick="show('air')"><h2>02 · Airflow</h2><p>Observe AirFlow around our Car</p><span class="pill">Tap Here</span></button>
<button class="card" onclick="show('car');setTimeout(openAR,250)"><h2>03 · AR</h2><p>Look at our Car in Real Life through the Camera.</p><span class="pill">Tap Here</span></button>
</div><div class="footer">silverracinguk.com</div></section>
<section id="car" class="screen"><header><button class="back" onclick="show('menu')">‹ Back</button><div class="brand">CAR · 3D</div><span></span></header><div class="title">The Silver Racing car.</div><div class="sub">  </div><div class="viewer-wrap"><model-viewer id="mv" src="srcar.glb" ios-src="srcar.usdz" camera-controls touch-action="pan-y" interaction-prompt="auto" shadow-intensity="1" exposure="1" ar ar-modes="quick-look" alt="Silver Racing STEM Racing car"></model-viewer><button class="ar-button" onclick="openAR()">View in AR ↗</button></div></section>
<section id="air" class="screen"><header><button class="back" onclick="show('menu')">‹ Back</button><div class="brand"></div><span></span></header><div class="title">Watch the air move.</div><div class="sub">Airflow visualisation around the Silver Racing car.</div><div class="air-card"><canvas id="air3d"></canvas><div id="airStatus" style="position:absolute;left:18px;top:18px;background:rgba(4,12,25,.84);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--silver)">Loading car model…</div><div class="air-ui"><label class="control">Speed <input id="speed" type="range" min="0.2" max="2.5" step="0.1" value="1"></label><button id="flow" class="toggle on" onclick="toggleFlow()">Flow ON</button><button id="resetCam" class="toggle" onclick="resetAirCamera()">Reset view</button></div></div></section>
</div>
<script>
const screens=['splash','menu','car','air'];
function show(id){screens.forEach(s=>document.getElementById(s).classList.toggle('active',s===id));if(id==='air')setTimeout(()=>{if(window.initAir)window.initAir();else{const s=document.getElementById('airStatus');if(s)s.textContent='Airflow module failed to load. Please refresh.'}},60)}
function openAR(){const mv=document.getElementById('mv'); if(mv&&typeof mv.activateAR==='function'){mv.activateAR().catch(()=>{window.location.href='srcar.usdz'})}else{window.location.href='srcar.usdz'}}
let idleTimer;function resetIdle(){clearTimeout(idleTimer);idleTimer=setTimeout(()=>{if(!document.getElementById('splash').classList.contains('active'))show('splash')},180000)}['touchstart','pointerdown','keydown'].forEach(e=>document.addEventListener(e,resetIdle,{passive:true}));resetIdle();
</script>

function base64ToArrayBuffer(b64str){
  const binary=atob(b64str);
  const len=binary.length;
  const bytes=new Uint8Array(len);
  for(let i=0;i<len;i++){bytes[i]=binary.charCodeAt(i)}
  return bytes.buffer;
}

  renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));
  renderer.outputColorSpace=THREE.SRGBColorSpace;
  controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.07;controls.target.set(0,0,0);controls.minDistance=.18;controls.maxDistance=1.4;
  scene.add(new THREE.HemisphereLight(0xbfd8ff,0x071329,2));
  const key=new THREE.DirectionalLight(0xffffff,2.2);key.position.set(1,2,2);scene.add(key);
  resize();
  raf=requestAnimationFrame(loop);
  window.addEventListener('resize',resize);

  // Decoded from the embedded base64 string above — no network request,
  // so there is nothing left to 404, mis-cache, or hang on.
  try{
    const buf=base64ToArrayBuffer(CAR_STL_BASE64);
    const geo=new STLLoader().parse(buf);
    geo.computeVertexNormals();geo.center();geo.scale(.001,.001,.001);
    car=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xbfc7d2,metalness:.72,roughness:.28,side:THREE.DoubleSide}));
    car.rotation.x=-Math.PI/2;
    scene.add(car);
    makeParticles();
    setStatus(null);
  }catch(err){
    console.error('Airflow build error:',err);
    setStatus('Airflow error: '+(err && err.message ? err.message : String(err)));
  }
}

function makeParticles(){const N=35;const arr=new Float32Array(N*3);pts=[];for(let i=0;i<N;i++){const x=XMIN-.18+Math.random()*(XMAX-XMIN+.36);const r=.045+Math.random()*.15;const a=Math.random()*Math.PI*2;const zoff=r*Math.cos(a),yoff=r*Math.sin(a);pts.push({x,r,a,y:yoff,z:zoff,phase:Math.random()});arr[i*3]=x;arr[i*3+1]=yoff;arr[i*3+2]=zoff}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(arr,3));const m=new THREE.PointsMaterial({color:0x9bd1ff,size:.016,sizeAttenuation:true,transparent:true,opacity:.95});particles=new THREE.Points(g,m);scene.add(particles)}
function updateParticles(dt){if(!particles)return;const a=particles.geometry.attributes.position.array, sp=+document.getElementById('speed').value;if(running){for(let i=0;i<pts.length;i++){const p=pts[i];p.x+=dt*.16*sp;if(p.x>XMAX+.22)p.x=XMIN-.18;p.phase+=dt*.7;const t=(p.x-XMIN)/(XMAX-XMIN);const rr=radiusAt(t);let rad=p.r;if(t>-.05&&t<1.08&&rad<rr+.012)rad=rr+.012;const swirl=t>1?Math.sin(p.phase+i*.03)*.012*(t-1):0;p.a+=swirl;const yy=rad*Math.sin(p.a),zz=rad*Math.cos(p.a);a[i*3]=p.x;a[i*3+1]=yy;a[i*3+2]=zz}}particles.geometry.attributes.position.needsUpdate=true}
function loop(now){const last=loop.last||now;const dt=Math.min(.04,(now-last)/1000);loop.last=now;updateParticles(dt);if(renderer){controls.update();renderer.render(scene,camera)}raf=requestAnimationFrame(loop)}
function resize(){if(!renderer)return;const r=canvas.getBoundingClientRect();if(r.width<2||r.height<2)return;renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
window.toggleFlow=()=>{running=!running;const b=document.getElementById('flow');b.textContent='Flow '+(running?'ON':'OFF');b.classList.toggle('on',running)};
window.resetAirCamera=()=>{camera.position.set(.55,.25,.48);controls.target.set(0,0,0);controls.update()};
window.initAir=initAir;
</script></body></html>
